<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dc4ec"/><stop offset="1" stop-color="#dff2fc"/>
    </linearGradient>
    <linearGradient id="lawn2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#84b96c"/><stop offset="1" stop-color="#66a04f"/>
    </linearGradient>
    <linearGradient id="cleanCon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3eaef"/><stop offset="1" stop-color="#c9d4dc"/>
    </linearGradient>
    <linearGradient id="dirtyCon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8578"/><stop offset="1" stop-color="#6e695c"/>
    </linearGradient>
  </defs>

  <!-- sky + garage backdrop -->
  <rect width="1600" height="900" fill="url(#sky2)"/>
  <g fill="#ffffff" opacity=".9">
    <ellipse cx="300" cy="120" rx="120" ry="34"/>
    <ellipse cx="395" cy="100" rx="82" ry="26"/>
    <ellipse cx="1290" cy="140" rx="130" ry="36"/>
  </g>

  <!-- garage -->
  <polygon points="330,240 800,110 1270,240" fill="#37506a"/>
  <rect x="316" y="232" width="968" height="18" rx="6" fill="#5b6b7a"/>
  <rect x="370" y="250" width="860" height="230" fill="#edf3f7"/>
  <g stroke="#d3e0ea" stroke-width="3">
    <path d="M370 280h860M370 310h860M370 340h860"/>
  </g>
  <rect x="430" y="300" width="330" height="180" rx="8" fill="#c9d4dc"/>
  <g stroke="#aebcc7" stroke-width="4"><path d="M430 345h330M430 390h330M430 435h330"/></g>
  <rect x="840" y="300" width="330" height="180" rx="8" fill="#c9d4dc"/>
  <g stroke="#aebcc7" stroke-width="4"><path d="M840 345h330M840 390h330M840 435h330"/></g>

  <!-- lawn -->
  <rect y="480" width="1600" height="420" fill="url(#lawn2)"/>

  <!-- driveway: dirty left half, spotless right half -->
  <polygon points="470,480 1130,480 1520,900 80,900" fill="url(#dirtyCon)"/>
  <polygon points="800,480 1130,480 1520,900 800,900" fill="url(#cleanCon)"/>
  <!-- wash boundary curve -->
  <path d="M800 480q-26 110 10 210t-14 210" fill="none" stroke="#ffffff" stroke-width="10" opacity=".85"/>
  <path d="M800 480q-26 110 10 210t-14 210" fill="none" stroke="#bfe9ff" stroke-width="26" opacity=".35"/>

  <!-- stains on the dirty side -->
  <g fill="#57533f">
    <ellipse cx="480" cy="600" rx="120" ry="34" opacity=".55"/>
    <ellipse cx="360" cy="740" rx="150" ry="42" opacity=".5"/>
    <ellipse cx="640" cy="690" rx="100" ry="30" opacity=".5"/>
    <ellipse cx="560" cy="830" rx="140" ry="36" opacity=".45"/>
  </g>
  <g fill="#4a5d3a" opacity=".5">
    <ellipse cx="300" cy="640" rx="90" ry="24"/>
    <ellipse cx="700" cy="800" rx="90" ry="26"/>
  </g>

  <!-- expansion joints (clean side shows crisp lines) -->
  <g stroke="#aeb9c2" stroke-width="6" opacity=".9">
    <path d="M1000 480L1240 900"/>
    <path d="M860 620l520 0" transform="skewX(-8)"/>
  </g>
  <g stroke="#4f4b3d" stroke-width="6" opacity=".5">
    <path d="M600 480L360 900"/>
  </g>

  <!-- surface cleaner machine on the boundary -->
  <ellipse cx="812" cy="690" rx="86" ry="34" fill="#d61f26"/>
  <ellipse cx="812" cy="678" rx="86" ry="34" fill="#ef3b42"/>
  <ellipse cx="812" cy="676" rx="60" ry="22" fill="#b7161c"/>
  <rect x="806" y="560" width="12" height="110" rx="6" transform="rotate(18 812 615)" fill="#33424f"/>
  <!-- spray ring under the cleaner -->
  <g fill="#eaf7ff">
    <circle cx="742" cy="702" r="6"/><circle cx="884" cy="700" r="6"/>
    <circle cx="762" cy="722" r="4"/><circle cx="862" cy="722" r="4"/>
    <circle cx="812" cy="730" r="5"/>
  </g>

  <!-- operator -->
  <g transform="translate(880,430)">
    <rect x="18" y="190" width="20" height="80" rx="9" fill="#22303f"/>
    <rect x="48" y="190" width="20" height="80" rx="9" fill="#22303f"/>
    <path d="M12 110q30-22 62 0l6 86H8z" fill="#0274be"/>
    <rect x="-30" y="122" width="64" height="18" rx="9" transform="rotate(24 -30 131)" fill="#0274be"/>
    <circle cx="42" cy="78" r="24" fill="#f2c9a0"/>
    <path d="M16 72q26-18 52 0l-4-16q-22-12-44 0z" fill="#002b47"/>
    <rect x="12" y="68" width="60" height="9" rx="4.5" fill="#002b47"/>
  </g>

  <!-- sparkles on the clean side -->
  <g fill="#ffffff">
    <path d="M1150 600l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" opacity=".95"/>
    <path d="M1290 730l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" opacity=".9"/>
    <path d="M990 560l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" opacity=".85"/>
  </g>
  <g fill="#ffd766">
    <path d="M1080 800l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
  </g>

  <!-- bushes -->
  <g fill="#4f7d3f">
    <ellipse cx="180" cy="500" rx="80" ry="36"/>
    <ellipse cx="1430" cy="500" rx="86" ry="38"/>
    <ellipse cx="1360" cy="510" rx="52" ry="26"/>
  </g>
</svg>
