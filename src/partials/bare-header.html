  <!-- Stripped header for the quote page. No nav, no dropdowns, no service
       links — someone who clicked "Get A Fast Quote" has already decided.
       What stays is the logo (so the page isn't a dead end) and the phone
       number, because calling is the other way to reach us. -->
  <header class="bare-header">
    <div class="container bare-header__inner">
      <a class="brand" href="index.html">
        <span class="brand__mark" data-brand-mark aria-hidden="true">
          <img class="brand__logo" src="assets/img/logo.png" alt="" data-brand-logo>
          <svg class="brand__fallback" viewBox="0 0 48 48">
            <defs>
              <linearGradient id="lgMarkB" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#1d4ed8"/>
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#lgMarkB)"/>
            <path d="M24 10c5 6.5 9 11.2 9 16a9 9 0 1 1-18 0c0-4.8 4-9.5 9-16z" fill="#fff"/>
          </svg>
        </span>
        <span class="brand__text">
        <span class="brand__name">Simply Spotless</span>
        <span class="brand__tag">Pressure Washing</span>
        </span>
      </a>
      <a class="btn btn--phone-outline bare-header__phone" data-tel href="#"><span data-phone>Call Us</span></a>
    </div>
  </header>
