<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="skyK" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dc4ec"/><stop offset="1" stop-color="#dff2fc"/>
    </linearGradient>
    <linearGradient id="lawnK" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#84b96c"/><stop offset="1" stop-color="#66a04f"/>
    </linearGradient>
    <linearGradient id="dirtyWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b8368"/><stop offset="1" stop-color="#6f6851"/>
    </linearGradient>
    <linearGradient id="cleanWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8a76a"/><stop offset="1" stop-color="#c08e52"/>
    </linearGradient>
    <linearGradient id="sprayK" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#bfe9ff" stop-opacity=".25"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="900" fill="url(#skyK)"/>
  <g fill="#ffffff" opacity=".9">
    <ellipse cx="300" cy="120" rx="118" ry="34"/>
    <ellipse cx="392" cy="102" rx="80" ry="26"/>
    <ellipse cx="1300" cy="140" rx="128" ry="36"/>
  </g>

  <!-- house wall behind -->
  <rect x="0" y="150" width="1600" height="330" fill="#edf3f7"/>
  <g stroke="#d3e0ea" stroke-width="3">
    <path d="M0 190h1600M0 230h1600M0 270h1600M0 310h1600M0 350h1600M0 390h1600M0 430h1600"/>
  </g>
  <rect x="1120" y="210" width="150" height="120" rx="8" fill="#ffffff"/>
  <rect x="1132" y="222" width="126" height="96" rx="4" fill="#bfe3f5"/>
  <path d="M1195 222v96M1132 270h126" stroke="#ffffff" stroke-width="6"/>

  <!-- lawn -->
  <rect y="700" width="1600" height="200" fill="url(#lawnK)"/>

  <!-- fence panel on the left: dirty, being cleaned -->
  <g>
    <rect x="60" y="300" width="470" height="300" fill="url(#dirtyWood)"/>
    <g stroke="#5d5844" stroke-width="4" opacity=".7">
      <path d="M60 340h470M60 380h470M60 420h470M60 460h470M60 500h470M60 540h470M60 580h470"/>
    </g>
    <g fill="#5b6b45" opacity=".55">
      <ellipse cx="180" cy="470" rx="90" ry="60"/>
      <ellipse cx="380" cy="530" rx="110" ry="50"/>
      <ellipse cx="120" cy="560" rx="70" ry="34"/>
    </g>
    <!-- posts -->
    <rect x="52" y="286" width="26" height="330" rx="5" fill="#5f5947"/>
    <rect x="512" y="286" width="26" height="330" rx="5" fill="#5f5947"/>
  </g>

  <!-- deck boards: clean, restored -->
  <g>
    <polygon points="560,600 1560,600 1600,900 480,900" fill="url(#cleanWood)"/>
    <g stroke="#a9773f" stroke-width="4" opacity=".65">
      <path d="M572,640 L1568,640"/>
      <path d="M560,690 L1580,690"/>
      <path d="M546,745 L1590,745"/>
      <path d="M530,805 L1596,805"/>
      <path d="M512,865 L1600,865"/>
    </g>
    <!-- board seams running away from the viewer -->
    <g stroke="#b8834a" stroke-width="3" opacity=".5">
      <path d="M760 600L735 900M980 600L985 900M1200 600L1235 900M1400 600L1470 900"/>
    </g>
  </g>

  <!-- deck railing -->
  <g>
    <rect x="560" y="470" width="1040" height="16" rx="6" fill="#c08e52"/>
    <rect x="560" y="560" width="1040" height="12" rx="5" fill="#c08e52"/>
    <g fill="#cf9c5e">
      <rect x="600" y="480" width="12" height="86" rx="4"/>
      <rect x="700" y="480" width="12" height="86" rx="4"/>
      <rect x="800" y="480" width="12" height="86" rx="4"/>
      <rect x="900" y="480" width="12" height="86" rx="4"/>
      <rect x="1000" y="480" width="12" height="86" rx="4"/>
      <rect x="1100" y="480" width="12" height="86" rx="4"/>
      <rect x="1200" y="480" width="12" height="86" rx="4"/>
      <rect x="1300" y="480" width="12" height="86" rx="4"/>
      <rect x="1400" y="480" width="12" height="86" rx="4"/>
      <rect x="1500" y="480" width="12" height="86" rx="4"/>
    </g>
    <rect x="556" y="452" width="34" height="130" rx="6" fill="#a9773f"/>
  </g>

  <!-- clean/dirty boundary glow on the fence -->
  <path d="M520 300q22 90 -6 160t10 150" fill="none" stroke="#ffffff" stroke-width="14" opacity=".85" stroke-linecap="round"/>

  <!-- water jet from the wand -->
  <polygon points="826,470 566,352 540,404 812,494" fill="url(#sprayK)"/>
  <g fill="#eaf7ff">
    <circle cx="560" cy="374" r="7"/><circle cx="600" cy="392" r="5"/>
    <circle cx="528" cy="392" r="5"/><circle cx="648" cy="414" r="6"/>
    <circle cx="586" cy="430" r="4"/><circle cx="516" cy="424" r="4"/>
  </g>

  <!-- operator standing on the deck -->
  <g transform="translate(830,430)">
    <rect x="16" y="188" width="21" height="86" rx="9" fill="#22303f"/>
    <rect x="48" y="188" width="21" height="86" rx="9" fill="#22303f"/>
    <path d="M10 108q30-22 62 0l6 88H4z" fill="#0274be"/>
    <rect x="-32" y="120" width="64" height="19" rx="9" transform="rotate(-16 -32 129)" fill="#0274be"/>
    <circle cx="42" cy="76" r="24" fill="#f2c9a0"/>
    <path d="M16 70q26-18 52 0l-4-16q-22-12-44 0z" fill="#002b47"/>
    <rect x="12" y="66" width="60" height="9" rx="4.5" fill="#002b47"/>
    <!-- wand -->
    <rect x="-46" y="30" width="76" height="11" rx="5" transform="rotate(12 -46 35)" fill="#33424f"/>
    <rect x="-70" y="26" width="24" height="15" rx="5" transform="rotate(12 -70 33)" fill="#002b47"/>
    <!-- hose -->
    <path d="M70 190q120 50 200 30" fill="none" stroke="#33424f" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- sparkles on the restored wood -->
  <g fill="#ffffff">
    <path d="M1180 660l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" opacity=".95"/>
    <path d="M1380 760l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" opacity=".9"/>
    <path d="M1020 810l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" opacity=".85"/>
  </g>
  <g fill="#ffd766">
    <path d="M1300 640l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
  </g>

  <!-- planter -->
  <g>
    <path d="M1440 560h110l-14 60h-82z" fill="#9d6b46"/>
    <ellipse cx="1495" cy="548" rx="56" ry="24" fill="#4f7d3f"/>
    <ellipse cx="1460" cy="536" rx="34" ry="18" fill="#5e9349"/>
  </g>
</svg>
