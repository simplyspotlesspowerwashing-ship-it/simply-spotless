<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640">
  <defs>
    <linearGradient id="skyD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aad4ee"/><stop offset="1" stop-color="#d7ecf8"/>
    </linearGradient>
    <linearGradient id="wallD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8fb"/><stop offset="1" stop-color="#e4edf4"/>
    </linearGradient>
    <linearGradient id="roofD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#41586f"/><stop offset="1" stop-color="#2b3c4e"/>
    </linearGradient>
  </defs>

  <!-- sky + grass (identical geometry to the grime overlay) -->
  <rect width="1000" height="640" fill="url(#skyD)"/>
  <rect y="560" width="1000" height="80" fill="#79ad63"/>
  <rect y="556" width="1000" height="8" fill="#6b9c57"/>

  <!-- roof band -->
  <rect x="30" y="66" width="940" height="58" fill="url(#roofD)"/>
  <rect x="18" y="116" width="964" height="16" rx="4" fill="#5b6b7a"/>

  <!-- spotless wall -->
  <rect x="60" y="132" width="880" height="392" fill="url(#wallD)"/>
  <g stroke="#d3e0ea" stroke-width="2">
    <path d="M60 160h880M60 188h880M60 216h880M60 244h880M60 272h880M60 300h880M60 328h880M60 356h880M60 384h880M60 412h880M60 440h880M60 468h880M60 496h880"/>
  </g>

  <!-- sparkling windows -->
  <g>
    <rect x="150" y="176" width="130" height="104" rx="6" fill="#ffffff"/>
    <rect x="160" y="186" width="110" height="84" rx="3" fill="#bfe3f5"/>
    <path d="M215 186v84M160 228h110" stroke="#ffffff" stroke-width="5"/>
    <path d="M170 258l48-60" stroke="#ffffff" stroke-width="8" opacity=".55" stroke-linecap="round"/>
    <rect x="720" y="176" width="130" height="104" rx="6" fill="#ffffff"/>
    <rect x="730" y="186" width="110" height="84" rx="3" fill="#bfe3f5"/>
    <path d="M785 186v84M730 228h110" stroke="#ffffff" stroke-width="5"/>
    <path d="M740 258l48-60" stroke="#ffffff" stroke-width="8" opacity=".55" stroke-linecap="round"/>
  </g>

  <!-- THE DEAL — bold red lettering on the clean siding -->
  <g text-anchor="middle" fill="#d61f26" font-family="Arial, Helvetica, sans-serif">
    <text x="500" y="408" font-size="140" font-weight="900" letter-spacing="2">$25 OFF</text>
    <text x="500" y="472" font-size="42" font-weight="800" letter-spacing="14">ALL HOUSE WASHES</text>
  </g>

  <!-- clean foundation -->
  <rect x="60" y="524" width="880" height="36" fill="#b9c4cd"/>

  <!-- downspout -->
  <rect x="66" y="132" width="18" height="392" rx="6" fill="#9aa8b4"/>

  <!-- healthy bushes -->
  <g fill="#4f7d3f">
    <ellipse cx="130" cy="560" rx="70" ry="36"/>
    <ellipse cx="880" cy="562" rx="76" ry="38"/>
    <ellipse cx="820" cy="572" rx="50" ry="28"/>
  </g>

  <!-- sparkles (kept clear of the deal lettering) -->
  <g fill="#ffffff">
    <path d="M340 190l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" opacity=".95"/>
    <path d="M500 158l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" opacity=".9"/>
    <path d="M118 340l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" opacity=".9"/>
    <path d="M905 330l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" opacity=".85"/>
  </g>
  <g fill="#ffd766">
    <path d="M640 205l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
    <path d="M175 505l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/>
  </g>
</svg>
