  <rect x="336" y="312" width="928" height="18" rx="6" fill="#5b6b7a"/>

  <!-- bright walls -->
  <rect x="400" y="330" width="800" height="310" fill="#edf3f7"/>
  <g stroke="#d3e0ea" stroke-width="3">
